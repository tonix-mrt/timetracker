<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arbeitszeit-Tracker</title>
  <style>
    :root {
      --bg: #f4f6f8;
      --card-bg: #ffffff;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --text: #1f2937;
      --border: #e5e7eb;
      --positive: #16a34a;
      --negative: #dc2626;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 2rem 1rem;
      margin: 0;
    }

    .container {
      background: var(--card-bg);
      width: 100%;
      max-width: 650px;
      padding: 1.5rem 2rem;
      border-radius: 10px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }

    h1 {
      margin-top: 0;
      font-size: 1.5rem;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 1rem;
      margin-bottom: 1.25rem;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }

    label {
      font-size: 0.85rem;
      font-weight: 600;
      color: #4b5563;
    }

    input {
      padding: 0.5rem 0.65rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 0.95rem;
    }

    input:focus {
      outline: 2px solid var(--primary);
      border-color: transparent;
    }

    .actions {
      display: flex;
      gap: 0.75rem;
      margin-bottom: 1.5rem;
    }

    button {
      cursor: pointer;
      border: none;
      border-radius: 6px;
      padding: 0.6rem 1rem;
      font-weight: 600;
      transition: background 0.15s;
    }

    .btn-primary {
      background: var(--primary);
      color: #fff;
      flex: 1;
    }

    .btn-primary:hover {
      background: var(--primary-hover);
    }

    .summary-card {
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1rem;
      margin-bottom: 1.5rem;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      text-align: center;
    }

    .summary-label {
      font-size: 0.8rem;
      color: #64748b;
      margin-bottom: 0.25rem;
    }

    .summary-value {
      font-size: 1.2rem;
      font-weight: 700;
    }

    .positive { color: var(--positive); }
    .negative { color: var(--negative); }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
    }

    th, td {
      padding: 0.6rem 0.5rem;
      text-align: left;
      border-bottom: 1px solid var(--border);
    }

    th {
      color: #64748b;
      font-weight: 600;
    }

    .btn-delete {
      background: transparent;
      color: var(--negative);
      padding: 0.2rem 0.5rem;
      font-size: 0.8rem;
    }

    .btn-delete:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Arbeitszeit-Tracker</h1>

    <div class="form-grid">
      <div class="field">
        <label for="entryDate">Datum</label>
        <input type="date" id="entryDate">
      </div>
      <div class="field">
        <label for="startTime">Anfangszeit</label>
        <input type="time" id="startTime" value="08:00">
      </div>
      <div class="field">
        <label for="endTime">Endzeit</label>
        <input type="time" id="endTime" value="16:30">
      </div>
      <div class="field">
        <label for="breakTime">Pause (Minuten)</label>
        <input type="number" id="breakTime" value="30" min="0" step="5">
      </div>
    </div>

    <div class="actions">
      <button class="btn-primary" onclick="addEntry()">Eintrag speichern</button>
    </div>

    <!-- Live-Kalkulation des aktuellen Formulars -->
    <div class="summary-card">
      <div>
        <div class="summary-label">Soll</div>
        <div class="summary-value">08:00 h</div>
      </div>
      <div>
        <div class="summary-label">Ist (Vorschau)</div>
        <div class="summary-value" id="previewWork">08:00 h</div>
      </div>
      <div>
        <div class="summary-label">Differenz</div>
        <div class="summary-value" id="previewDiff">±00:00 h</div>
      </div>
    </div>

    <!-- Gespeicherte Liste -->
    <table>
      <thead>
        <tr>
          <th>Datum</th>
          <th>Arbeitszeit</th>
          <th>Pause</th>
          <th>Netto</th>
          <th>Diff.</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="entriesTable">
        <!-- Einträge werden hier dynamisch eingefügt -->
      </tbody>
    </table>
  </div>

  <script>
    const TARGET_MINUTES = 8 * 60; // 8 Stunden Sollarbeitszeit

    document.getElementById('entryDate').valueAsDate = new Date();

    const startInput = document.getElementById('startTime');
    const endInput = document.getElementById('endTime');
    const breakInput = document.getElementById('breakTime');

    [startInput, endInput, breakInput].forEach(el => {
      el.addEventListener('input', updatePreview);
    });

    function parseMinutes(timeStr) {
      if (!timeStr) return null;
      const [h, m] = timeStr.split(':').map(Number);
      return h * 60 + m;
    }

    function formatHoursMinutes(totalMinutes, showSign = false) {
      const isNegative = totalMinutes < 0;
      const absMinutes = Math.abs(totalMinutes);
      const h = Math.floor(absMinutes / 60).toString().padStart(2, '0');
      const m = (absMinutes % 60).toString().padStart(2, '0');
      
      let sign = '';
      if (showSign) {
        if (totalMinutes > 0) sign = '+';
        else if (totalMinutes < 0) sign = '-';
        else sign = '±';
      }
      return `${sign}${h}:${m} h`;
    }

    function calculateCurrentValues() {
      const start = parseMinutes(startInput.value);
      const end = parseMinutes(endInput.value);
      const pause = parseInt(breakInput.value, 10) || 0;

      if (start === null || end === null || end <= start) {
        return null;
      }

      const grossMinutes = end - start;
      const netMinutes = Math.max(0, grossMinutes - pause);
      const diffMinutes = netMinutes - TARGET_MINUTES;

      return { netMinutes, diffMinutes };
    }

    function updatePreview() {
      const values = calculateCurrentValues();
      const workEl = document.getElementById('previewWork');
      const diffEl = document.getElementById('previewDiff');

      if (!values) {
        workEl.textContent = '--:--';
        diffEl.textContent = '--:--';
        diffEl.className = 'summary-value';
        return;
      }

      workEl.textContent = formatHoursMinutes(values.netMinutes);
      diffEl.textContent = formatHoursMinutes(values.diffMinutes, true);

      diffEl.className = 'summary-value ' + (values.diffMinutes > 0 ? 'positive' : values.diffMinutes < 0 ? 'negative' : '');
    }

    function getEntries() {
      return JSON.parse(localStorage.getItem('work_tracker_entries') || '[]');
    }

    function saveEntries(entries) {
      localStorage.setItem('work_tracker_entries', JSON.stringify(entries));
      renderTable();
    }

    function addEntry() {
      const values = calculateCurrentValues();
      if (!values) {
        alert('Bitte gib gültige Uhrzeiten ein (Endzeit muss nach Anfangszeit liegen).');
        return;
      }

      const date = document.getElementById('entryDate').value;
      if (!date) {
        alert('Bitte wähle ein Datum aus.');
        return;
      }

      const entry = {
        id: Date.now(),
        date: date,
        start: startInput.value,
        end: endInput.value,
        pause: parseInt(breakInput.value, 10) || 0,
        netMinutes: values.netMinutes,
        diffMinutes: values.diffMinutes
      };

      const entries = getEntries();
      entries.unshift(entry);
      saveEntries(entries);
    }

    function deleteEntry(id) {
      const entries = getEntries().filter(e => e.id !== id);
      saveEntries(entries);
    }

    function renderTable() {
      const entries = getEntries();
      const tbody = document.getElementById('entriesTable');
      tbody.innerHTML = '';

      entries.forEach(entry => {
        const tr = document.createElement('tr');
        const diffClass = entry.diffMinutes > 0 ? 'positive' : entry.diffMinutes < 0 ? 'negative' : '';
        
        tr.innerHTML = `
          <td>${entry.date}</td>
          <td>${entry.start} – ${entry.end}</td>
          <td>${entry.pause} min</td>
          <td>${formatHoursMinutes(entry.netMinutes)}</td>
          <td class="${diffClass}">${formatHoursMinutes(entry.diffMinutes, true)}</td>
          <td><button class="btn-delete" onclick="deleteEntry(${entry.id})">Löschen</button></td>
        `;
        tbody.appendChild(tr);
      });
    }

    // Initialisierung
    updatePreview();
    renderTable();
  </script>
</body>
</html>
