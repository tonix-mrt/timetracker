<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arbeitszeit-Tracker mit Dark Mode</title>
  <style>
    :root {
      --bg: #f4f6f8;
      --card-bg: #ffffff;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --text: #1f2937;
      --text-muted: #64748b;
      --label-color: #4b5563;
      --border: #e5e7eb;
      --positive: #16a34a;
      --negative: #dc2626;
      --widget-bg: #0f172a;
      --widget-text: #ffffff;
      --widget-sub: #cbd5e1;
      --widget-muted: #94a3b8;
      --summary-bg: #f8fafc;
      --summary-border: #e5e7eb;
      --input-bg: #ffffff;
      --accordion-summary-bg: #f8fafc;
      --accordion-hover: #f1f5f9;
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }

    [data-theme="dark"] {
      --bg: #0b1120;
      --card-bg: #1e293b;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --label-color: #cbd5e1;
      --border: #334155;
      --positive: #22c55e;
      --negative: #ef4444;
      --widget-bg: #020617;
      --widget-text: #f8fafc;
      --widget-sub: #94a3b8;
      --widget-muted: #64748b;
      --summary-bg: #0f172a;
      --summary-border: #334155;
      --input-bg: #0f172a;
      --accordion-summary-bg: #0f172a;
      --accordion-hover: #1e293b;
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.4);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 2rem 1rem;
      margin: 0;
      transition: background 0.2s ease, color 0.2s ease;
    }

    .container {
      background: var(--card-bg);
      width: 100%;
      max-width: 650px;
      padding: 1.5rem 2rem;
      border-radius: 12px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      transition: background 0.2s ease, border-color 0.2s ease;
    }

    .header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.25rem;
    }

    h1 {
      margin: 0;
      font-size: 1.5rem;
    }

    /* Dark Mode Umschalter */
    .btn-theme-toggle {
      background: var(--summary-bg);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 1rem;
      padding: 0.45rem 0.8rem;
      border-radius: 8px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      font-weight: 500;
      transition: background 0.15s, border-color 0.15s;
    }

    .btn-theme-toggle:hover {
      background: var(--accordion-hover);
    }

    /* Live Feierabend Banner */
    .timer-widget {
      background: var(--widget-bg);
      color: var(--widget-text);
      padding: 1.25rem;
      border-radius: 8px;
      margin-bottom: 1.5rem;
      text-align: center;
      border: 1px solid var(--border);
    }

    .timer-label {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--widget-muted);
      margin-bottom: 0.25rem;
    }

    .timer-countdown {
      font-size: 2.2rem;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      margin: 0.25rem 0;
    }

    .timer-sub {
      font-size: 0.9rem;
      color: var(--widget-sub);
    }

    .progress-bar-bg {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 999px;
      height: 8px;
      margin-top: 1rem;
      overflow: hidden;
    }

    .progress-bar-fill {
      background: var(--positive);
      height: 100%;
      width: 0%;
      transition: width 0.2s ease;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 1rem;
      margin-bottom: 0.75rem;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }

    label {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--label-color);
    }

    input {
      padding: 0.5rem 0.65rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 0.95rem;
      background: var(--input-bg);
      color: var(--text);
      color-scheme: light dark;
      transition: background 0.2s, border-color 0.2s, color 0.2s;
    }

    input:focus {
      outline: 2px solid var(--primary);
      border-color: transparent;
    }

    .quick-actions {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 1rem;
    }

    .btn-link {
      background: none;
      border: none;
      color: var(--primary);
      font-size: 0.82rem;
      cursor: pointer;
      text-decoration: underline;
      padding: 0;
    }

    .btn-link:hover {
      color: var(--primary-hover);
    }

    .btn-primary {
      background: var(--primary);
      color: #fff;
      cursor: pointer;
      border: none;
      border-radius: 6px;
      padding: 0.65rem 1rem;
      font-weight: 600;
      width: 100%;
      margin-bottom: 1.5rem;
      transition: background 0.15s;
    }

    .btn-primary:hover {
      background: var(--primary-hover);
    }

    .summary-card {
      background: var(--summary-bg);
      border: 1px solid var(--summary-border);
      border-radius: 8px;
      padding: 1rem;
      margin-bottom: 1.5rem;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      text-align: center;
    }

    .summary-label {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 0.25rem;
    }

    .summary-value {
      font-size: 1.2rem;
      font-weight: 700;
    }

    .positive { color: var(--positive); }
    .negative { color: var(--negative); }

    /* Aufklappbarer Historien-Bereich */
    details.history-accordion {
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--card-bg);
      overflow: hidden;
      margin-top: 1rem;
    }

    summary.history-summary {
      padding: 0.85rem 1rem;
      font-weight: 600;
      font-size: 0.95rem;
      color: var(--text);
      cursor: pointer;
      background: var(--accordion-summary-bg);
      user-select: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
      outline: none;
      transition: background 0.15s ease;
    }

    summary.history-summary:hover {
      background: var(--accordion-hover);
    }

    .history-content {
      padding: 0.5rem 1rem 1rem;
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
    }

    th, td {
      padding: 0.6rem 0.5rem;
      text-align: left;
      border-bottom: 1px solid var(--border);
    }

    th {
      color: var(--text-muted);
      font-weight: 600;
    }

    .btn-delete {
      background: transparent;
      color: var(--negative);
      border: none;
      cursor: pointer;
      padding: 0.2rem 0.5rem;
      font-size: 0.8rem;
    }

    .btn-delete:hover {
      text-decoration: underline;
    }

    .empty-note {
      text-align: center;
      color: var(--text-muted);
      padding: 1.5rem 0;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header-row">
      <h1>Arbeitszeit-Tracker</h1>
      <button class="btn-theme-toggle" id="themeToggle" type="button" onclick="toggleTheme()" aria-label="Dark Mode umschalten">
        <span id="themeIcon">🌙</span>
        <span id="themeLabel" style="font-size: 0.85rem;">Dunkel</span>
      </button>
    </div>

    <!-- Live Timer Widget -->
    <div class="timer-widget">
      <div class="timer-label" id="timerHeading">Verbleibende Zeit bis Arbeitsende</div>
      <div class="timer-countdown" id="timerCountdown">--:--:--</div>
      <div class="timer-sub" id="timerTargetTime">Zielzeit: --:-- Uhr</div>
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="progressFill"></div>
      </div>
    </div>

    <!-- Eingabefelder -->
    <div class="form-grid">
      <div class="field">
        <label for="entryDate">Datum</label>
        <input type="date" id="entryDate">
      </div>
      <div class="field">
        <label for="startTime">Anfangszeit</label>
        <input type="time" id="startTime" value="08:00">
      </div>
      <div class="field">
        <label for="endTime">Endzeit</label>
        <input type="time" id="endTime" value="16:30">
      </div>
      <div class="field">
        <label for="breakTime">Pause (Minuten)</label>
        <input type="number" id="breakTime" value="30" min="0" step="5">
      </div>
    </div>

    <div class="quick-actions">
      <button type="button" class="btn-link" onclick="setExactTargetEnd()">Endzeit auf exakt 8h-Soll setzen</button>
    </div>

    <button class="btn-primary" onclick="addEntry()">Eintrag in Historie speichern</button>

    <!-- Vorschau-Berechnung -->
    <div class="summary-card">
      <div>
        <div class="summary-label">Soll</div>
        <div class="summary-value">08:00 h</div>
      </div>
      <div>
        <div class="summary-label">Ist (Vorschau)</div>
        <div class="summary-value" id="previewWork">08:00 h</div>
      </div>
      <div>
        <div class="summary-label">Differenz</div>
        <div class="summary-value" id="previewDiff">±00:00 h</div>
      </div>
    </div>

    <!-- Aufklappbare Historie -->
    <details class="history-accordion" id="historyDetails">
      <summary class="history-summary">
        <span>Gespeicherte Historie</span>
        <span id="historyCountBadge" style="font-size: 0.85rem; color: var(--text-muted); font-weight: normal;">(0 Einträge)</span>
      </summary>
      <div class="history-content">
        <table>
          <thead>
            <tr>
              <th>Datum</th>
              <th>Arbeitszeit</th>
              <th>Pause</th>
              <th>Netto</th>
              <th>Diff.</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="entriesTable"></tbody>
        </table>
        <div id="emptyNote" class="empty-note" style="display: none;">Noch keine Einträge gespeichert.</div>
      </div>
    </details>
  </div>

  <script>
    const TARGET_MINUTES = 8 * 60; // 8 Stunden Soll

    // --- Dark Mode Logik ---
    function initTheme() {
      const savedTheme = localStorage.getItem('tracker_theme');
      if (savedTheme) {
        setTheme(savedTheme);
      } else {
        const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        setTheme(prefersDark ? 'dark' : 'light');
      }
    }

    function setTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      localStorage.setItem('tracker_theme', theme);
      const iconEl = document.getElementById('themeIcon');
      const labelEl = document.getElementById('themeLabel');
      
      if (theme === 'dark') {
        iconEl.textContent = '☀️';
        labelEl.textContent = 'Hell';
      } else {
        iconEl.textContent = '🌙';
        labelEl.textContent = 'Dunkel';
      }
    }

    function toggleTheme() {
      const currentTheme = document.documentElement.getAttribute('data-theme') || 'light';
      setTheme(currentTheme === 'dark' ? 'light' : 'dark');
    }

    // --- Formular & Initialisierung ---
    document.getElementById('entryDate').valueAsDate = new Date();

    const startInput = document.getElementById('startTime');
    const endInput = document.getElementById('endTime');
    const breakInput = document.getElementById('breakTime');

    ['input', 'change', 'keyup'].forEach(eventName => {
      startInput.addEventListener(eventName, triggerUpdate);
      endInput.addEventListener(eventName, triggerUpdate);
      breakInput.addEventListener(eventName, triggerUpdate);
    });

    function triggerUpdate() {
      updatePreview();
      updateLiveTimer();
    }

    function parseMinutes(timeStr) {
      if (!timeStr) return null;
      const parts = timeStr.split(':');
      if (parts.length < 2) return null;
      return parseInt(parts[0], 10) * 60 + parseInt(parts[1], 10);
    }

    function formatHoursMinutes(totalMinutes, showSign = false) {
      const absMinutes = Math.abs(totalMinutes);
      const h = Math.floor(absMinutes / 60).toString().padStart(2, '0');
      const m = (absMinutes % 60).toString().padStart(2, '0');
      
      let sign = '';
      if (showSign) {
        if (totalMinutes > 0) sign = '+';
        else if (totalMinutes < 0) sign = '-';
        else sign = '±';
      }
      return `${sign}${h}:${m} h`;
    }

    function setExactTargetEnd() {
      const startMin = parseMinutes(startInput.value);
      if (startMin === null) return;
      const pauseMin = parseInt(breakInput.value, 10) || 0;
      
      const targetTotalMin = (startMin + TARGET_MINUTES + pauseMin) % (24 * 60);
      const h = Math.floor(targetTotalMin / 60).toString().padStart(2, '0');
      const m = (targetTotalMin % 60).toString().padStart(2, '0');
      
      endInput.value = `${h}:${m}`;
      triggerUpdate();
    }

    // --- Dynamischer Live-Timer & Countdown ---
    function updateLiveTimer() {
      const startMin = parseMinutes(startInput.value);
      const pauseMin = parseInt(breakInput.value, 10) || 0;
      const manualEndMin = parseMinutes(endInput.value);

      const headingEl = document.getElementById('timerHeading');
      const countdownEl = document.getElementById('timerCountdown');
      const targetTimeEl = document.getElementById('timerTargetTime');
      const progressEl = document.getElementById('progressFill');

      if (startMin === null) {
        countdownEl.textContent = "--:--:--";
        targetTimeEl.textContent = "Startzeit ungültig";
        progressEl.style.width = "0%";
        return;
      }

      let targetMin = manualEndMin;
      let isAutoCalculated = false;

      if (targetMin === null) {
        targetMin = startMin + TARGET_MINUTES + pauseMin;
        isAutoCalculated = true;
      }

      const endH = Math.floor(targetMin / 60) % 24;
      const endM = targetMin % 60;
      const targetFormatted = `${endH.toString().padStart(2, '0')}:${endM.toString().padStart(2, '0')}`;

      targetTimeEl.textContent = isAutoCalculated
        ? `Soll-Feierabend (8h + Pause): ${targetFormatted} Uhr`
        : `Ziel-Feierabend laut Endzeit: ${targetFormatted} Uhr`;

      const now = new Date();
      const currentSeconds = now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds();
      const startSeconds = startMin * 60;
      const targetSeconds = targetMin * 60;

      const diffSeconds = targetSeconds - currentSeconds;

      const totalSpanSeconds = targetSeconds - startSeconds;
      let progress = 0;
      if (totalSpanSeconds > 0) {
        progress = ((currentSeconds - startSeconds) / totalSpanSeconds) * 100;
      }
      progress = Math.max(0, Math.min(100, progress));
      progressEl.style.width = `${progress}%`;

      if (diffSeconds > 0) {
        headingEl.textContent = "Verbleibende Zeit bis Feierabend";
        const sec = Math.floor(diffSeconds % 60);
        const min = Math.floor((diffSeconds / 60) % 60);
        const hrs = Math.floor(diffSeconds / 3600);
        countdownEl.textContent = 
          `${hrs.toString().padStart(2, '0')}:${min.toString().padStart(2, '0')}:${sec.toString().padStart(2, '0')}`;
        countdownEl.style.color = "var(--widget-text)";
      } else {
        headingEl.textContent = "Feierabend erreicht! (Überstunden)";
        const overSeconds = Math.abs(diffSeconds);
        const sec = Math.floor(overSeconds % 60);
        const min = Math.floor((overSeconds / 60) % 60);
        const hrs = Math.floor(overSeconds / 3600);
        countdownEl.textContent = 
          `+${hrs.toString().padStart(2, '0')}:${min.toString().padStart(2, '0')}:${sec.toString().padStart(2, '0')}`;
        countdownEl.style.color = "var(--positive)";
      }
    }

    setInterval(updateLiveTimer, 1000);

    // --- Tabellen- & Vorschau-Logik ---
    function calculateCurrentValues() {
      const start = parseMinutes(startInput.value);
      const end = parseMinutes(endInput.value);
      const pause = parseInt(breakInput.value, 10) || 0;

      if (start === null || end === null || end <= start) {
        return null;
      }

      const grossMinutes = end - start;
      const netMinutes = Math.max(0, grossMinutes - pause);
      const diffMinutes = netMinutes - TARGET_MINUTES;

      return { netMinutes, diffMinutes };
    }

    function updatePreview() {
      const values = calculateCurrentValues();
      const workEl = document.getElementById('previewWork');
      const diffEl = document.getElementById('previewDiff');

      if (!values) {
        workEl.textContent = '--:--';
        diffEl.textContent = '--:--';
        diffEl.className = 'summary-value';
        return;
      }

      workEl.textContent = formatHoursMinutes(values.netMinutes);
      diffEl.textContent = formatHoursMinutes(values.diffMinutes, true);

      diffEl.className = 'summary-value ' + (values.diffMinutes > 0 ? 'positive' : values.diffMinutes < 0 ? 'negative' : '');
    }

    function getEntries() {
      return JSON.parse(localStorage.getItem('work_tracker_entries') || '[]');
    }

    function saveEntries(entries) {
      localStorage.setItem('work_tracker_entries', JSON.stringify(entries));
      renderTable();
    }

    function addEntry() {
      const values = calculateCurrentValues();
      if (!values) {
        alert('Bitte gib gültige Uhrzeiten ein (Endzeit muss nach Anfangszeit liegen).');
        return;
      }

      const date = document.getElementById('entryDate').value;
      if (!date) {
        alert('Bitte wähle ein Datum aus.');
        return;
      }

      const entry = {
        id: Date.now(),
        date: date,
        start: startInput.value,
        end: endInput.value,
        pause: parseInt(breakInput.value, 10) || 0,
        netMinutes: values.netMinutes,
        diffMinutes: values.diffMinutes
      };

      const entries = getEntries();
      entries.unshift(entry);
      saveEntries(entries);
    }

    function deleteEntry(id) {
      const entries = getEntries().filter(e => e.id !== id);
      saveEntries(entries);
    }

    function renderTable() {
      const entries = getEntries();
      const tbody = document.getElementById('entriesTable');
      const emptyNote = document.getElementById('emptyNote');
      const countBadge = document.getElementById('historyCountBadge');

      tbody.innerHTML = '';
      countBadge.textContent = `(${entries.length} ${entries.length === 1 ? 'Eintrag' : 'Einträge'})`;

      if (entries.length === 0) {
        emptyNote.style.display = 'block';
        return;
      }
      
      emptyNote.style.display = 'none';

      entries.forEach(entry => {
        const tr = document.createElement('tr');
        const diffClass = entry.diffMinutes > 0 ? 'positive' : entry.diffMinutes < 0 ? 'negative' : '';
        
        tr.innerHTML = `
          <td>${entry.date}</td>
          <td>${entry.start} – ${entry.end}</td>
          <td>${entry.pause} min</td>
          <td>${formatHoursMinutes(entry.netMinutes)}</td>
          <td class="${diffClass}">${formatHoursMinutes(entry.diffMinutes, true)}</td>
          <td><button class="btn-delete" onclick="deleteEntry(${entry.id})">Löschen</button></td>
        `;
        tbody.appendChild(tr);
      });
    }

    // Start-Initialisierung
    initTheme();
    triggerUpdate();
    renderTable();
  </script>
</body>
</html>
