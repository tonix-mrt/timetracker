<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arbeitszeit-Tracker mit Live-Countdown</title>
  <style>
    :root {
      --bg: #f4f6f8;
      --card-bg: #ffffff;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --text: #1f2937;
      --border: #e5e7eb;
      --positive: #16a34a;
      --negative: #dc2626;
      --accent: #0f172a;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 2rem 1rem;
      margin: 0;
    }

    .container {
      background: var(--card-bg);
      width: 100%;
      max-width: 650px;
      padding: 1.5rem 2rem;
      border-radius: 10px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }

    h1 {
      margin-top: 0;
      font-size: 1.5rem;
    }

    /* Live Feierabend Banner */
    .timer-widget {
      background: var(--accent);
      color: #fff;
      padding: 1.25rem;
      border-radius: 8px;
      margin-bottom: 1.5rem;
      text-align: center;
    }

    .timer-label {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #94a3b8;
      margin-bottom: 0.25rem;
    }

    .timer-countdown {
      font-size: 2.2rem;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      margin: 0.25rem 0;
    }

    .timer-sub {
      font-size: 0.9rem;
      color: #cbd5e1;
    }

    .progress-bar-bg {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 999px;
      height: 8px;
      margin-top: 1rem;
      overflow: hidden;
    }

    .progress-bar-fill {
      background: var(--positive);
      height: 100%;
      width: 0%;
      transition: width 0.2s ease;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 1rem;
      margin-bottom: 0.75rem;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }

    label {
      font-size: 0.85rem;
      font-weight: 600;
      color: #4b5563;
    }

    input {
      padding: 0.5rem 0.65rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 0.95rem;
    }

    input:focus {
      outline: 2px solid var(--primary);
      border-color: transparent;
    }

    .quick-actions {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 1rem;
    }

    .btn-link {
      background: none;
      border: none;
      color: var(--primary);
      font-size: 0.82rem;
      cursor: pointer;
      text-decoration: underline;
      padding: 0;
    }

    .btn-link:hover {
      color: var(--primary-hover);
    }

    .btn-primary {
      background: var(--primary);
      color: #fff;
      cursor: pointer;
      border: none;
      border-radius: 6px;
      padding: 0.6rem 1rem;
      font-weight: 600;
      width: 100%;
      margin-bottom: 1.5rem;
      transition: background 0.15s;
    }

    .btn-primary:hover {
      background: var(--primary-hover);
    }

    .summary-card {
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1rem;
      margin-bottom: 1.5rem;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      text-align: center;
    }

    .summary-label {
      font-size: 0.8rem;
